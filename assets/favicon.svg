<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Modern gradient backgrounds -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main circle background -->
  <circle cx="256" cy="256" r="240" fill="url(#mainGradient)" filter="url(#dropShadow)"/>

  <!-- Inner decorative circle -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Code brackets < > -->
  <g stroke="url(#accentGradient)" stroke-width="16" fill="none" stroke-linecap="round" filter="url(#glow)">
    <!-- Left bracket -->
    <path d="M160 180 L100 240 L100 272 L160 332"/>
    <!-- Right bracket -->
    <path d="M352 180 L412 240 L412 272 L352 332"/>
  </g>

  <!-- Central hexagon (representing code/structure) -->
  <polygon points="256,160 306,190 306,250 256,280 206,250 206,190"
           fill="rgba(255,255,255,0.15)"
           stroke="rgba(255,255,255,0.4)"
           stroke-width="3"/>

  <!-- Initials LM in the center -->
  <text x="256" y="240"
        font-family="Arial, sans-serif"
        font-size="64"
        font-weight="bold"
        text-anchor="middle"
        fill="white"
        filter="url(#glow)">LM</text>

  <!-- Small decorative elements around -->
  <g fill="rgba(255,255,255,0.6)">
    <!-- Dots pattern -->
    <circle cx="150" cy="150" r="6"/>
    <circle cx="362" cy="150" r="6"/>
    <circle cx="150" cy="362" r="6"/>
    <circle cx="362" cy="362" r="6"/>

    <!-- Small code symbols -->
    <circle cx="256" cy="120" r="4"/>
    <circle cx="256" cy="392" r="4"/>
    <circle cx="120" cy="256" r="4"/>
    <circle cx="392" cy="256" r="4"/>
  </g>

  <!-- Subtle connecting lines -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none">
    <line x1="150" y1="150" x2="206" y2="190"/>
    <line x1="362" y1="150" x2="306" y2="190"/>
    <line x1="150" y1="362" x2="206" y2="250"/>
    <line x1="362" y1="362" x2="306" y2="250"/>
  </g>

  <!-- Bottom accent text -->
  <text x="256" y="340"
        font-family="Arial, sans-serif"
        font-size="20"
        font-weight="normal"
        text-anchor="middle"
        fill="rgba(255,255,255,0.8)">IT FAN</text>
</svg>
